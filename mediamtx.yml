# Obraz: RTP H.264 z wfb-gs -> WebRTC dla przeglądarki, bez transkodowania.
# Do portu 5611 pakiety wysyła backend (rozdziela je też do QGC, gdy profil tak mówi).
logLevel: warn

api: no
metrics: no
pprof: no
playback: no
rtsp: no
rtmp: no
hls: no
srt: no

webrtc: yes
webrtcAddress: 127.0.0.1:8889
webrtcLocalUDPAddress: 127.0.0.1:8189
webrtcLocalTCPAddress: ""
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts: [127.0.0.1]

paths:
  video:
    source: udp+rtp://127.0.0.1:5611
    # Strumień z ffmpeg (wfb_video.py): payload type 96. SPS/PPS są w strumieniu.
    rtpSDP: |
      v=0
      o=- 0 0 IN IP4 127.0.0.1
      s=video
      c=IN IP4 127.0.0.1
      t=0 0
      m=video 5611 RTP/AVP 96
      a=rtpmap:96 H264/90000
      a=fmtp:96 packetization-mode=1
